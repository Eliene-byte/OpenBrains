[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/editor-core",
    "crates/ai",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Eliene-byte/OpenBrains"
authors = ["Eliene (OpenBrains)"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
egui = "0.36"
eframe = "0.36"

# Binário pequeno e rápido.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
